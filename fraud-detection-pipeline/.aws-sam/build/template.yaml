AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Real-Time AML & Fraud Detection Pipeline - Day 1 Foundation
Resources:
  TransactionGraphTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TransactionGraph
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      - AttributeName: GSI1PK
        AttributeType: S
      - AttributeName: GSI1SK
        AttributeType: S
      - AttributeName: GSI2PK
        AttributeType: S
      - AttributeName: GSI2SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: StatusIndex
        KeySchema:
        - AttributeName: GSI1PK
          KeyType: HASH
        - AttributeName: GSI1SK
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: PairIndex
        KeySchema:
        - AttributeName: GSI2PK
          KeyType: HASH
        - AttributeName: GSI2SK
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
  TransactionApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Models:
        TransactionModel:
          type: object
          required:
          - senderId
          - receiverId
          - amount
          - currency
          properties:
            senderId:
              type: string
            receiverId:
              type: string
            amount:
              type: number
            currency:
              type: string
  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: IngestionFunction
      Handler: app.lambda_handler
      Runtime: python3.11
      Environment:
        Variables:
          Ingestion_Table:
            Ref: TransactionGraphTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TransactionGraphTable
      Events:
        PostTransaction:
          Type: Api
          Properties:
            RestApiId:
              Ref: TransactionApi
            Path: /transactions
            Method: post
            RequestModel:
              Model: TransactionModel
              Required: true
              ValidateBody: true
    Metadata:
      SamResourceId: IngestionFunction
  FeatureExtractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: FeatureExtractionFunction
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME:
            Ref: TransactionGraphTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: TransactionGraphTable
    Metadata:
      SamResourceId: FeatureExtractionFunction
  GraphAnomalyScoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GraphAnomalyScoringFunction
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 5
    Metadata:
      SamResourceId: GraphAnomalyScoringFunction
  BedrockExplanationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: BedrockExplanationFunction
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 30
      Environment:
        Variables:
          BEDROCK_MODEL_ID: amazon.nova-pro-v1:0
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource: '*'
    Metadata:
      SamResourceId: BedrockExplanationFunction
  FraudDetectionWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: EXPRESS
      DefinitionUri: ../../statemachine/fraud_detection_workflow.asl.json
      DefinitionSubstitutions:
        FeatureExtractionFunctionArn:
          Fn::GetAtt:
          - FeatureExtractionFunction
          - Arn
        GraphAnomalyScoringFunctionArn:
          Fn::GetAtt:
          - GraphAnomalyScoringFunction
          - Arn
        BedrockExplanationFunctionArn:
          Fn::GetAtt:
          - BedrockExplanationFunction
          - Arn
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: FeatureExtractionFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: GraphAnomalyScoringFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: BedrockExplanationFunction
Outputs:
  TransactionApiUrl:
    Description: API Gateway endpoint URL for Prod stage
    Value:
      Fn::Sub: https://${TransactionApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/transactions
