AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Real-Time AML & Fraud Detection Pipeline - Production Ready

Globals:
  Function:
    Tracing: Active
    Timeout: 10
  Api:
    TracingEnabled: true

Resources:
  # -------------------------------------------------------------------------
  # 1. DynamoDB Single Table
  # -------------------------------------------------------------------------
  TransactionGraphTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TransactionGraph
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: PairIndex
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # -------------------------------------------------------------------------
  # 2. API Gateway with Request Validation
  # -------------------------------------------------------------------------
  TransactionApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Models:
        TransactionModel:
          type: object
          required:
            - senderId
            - receiverId
            - amount
            - currency
          properties:
            senderId:
              type: string
            receiverId:
              type: string
            amount:
              type: number
            currency:
              type: string

  # -------------------------------------------------------------------------
  # 3. Ingestion & Alerts Lambda
  # -------------------------------------------------------------------------
  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/ingestion/
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref TransactionGraphTable
          WORKFLOW_ARN: !Ref FraudDetectionWorkflow
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionGraphTable
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
                - states:StartSyncExecution
              Resource: !Ref FraudDetectionWorkflow
      Events:
        PostTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref TransactionApi
            Path: /transactions
            Method: post
            RequestModel:
              Model: TransactionModel
              Required: true
              ValidateBody: true
        GetAlerts:
          Type: Api
          Properties:
            RestApiId: !Ref TransactionApi
            Path: /alerts
            Method: get

  # -------------------------------------------------------------------------
  # 4. Feature Extraction Lambda
  # -------------------------------------------------------------------------
  FeatureExtractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/features/
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref TransactionGraphTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TransactionGraphTable

  # -------------------------------------------------------------------------
  # 5. Graph Anomaly Scoring Lambda
  # -------------------------------------------------------------------------
  GraphAnomalyScoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/scoring/
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 5

  # -------------------------------------------------------------------------
  # 6. Bedrock Explanation Lambda
  # -------------------------------------------------------------------------
  BedrockExplanationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/explanation/
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 30
      Environment:
        Variables:
          BEDROCK_MODEL_ID: amazon.nova-pro-v1:0
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"

  # -------------------------------------------------------------------------
  # 7. Step Functions Express Workflow
  # -------------------------------------------------------------------------
  FraudDetectionWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: EXPRESS
      DefinitionUri: statemachine/fraud_detection_workflow.asl.json
      DefinitionSubstitutions:
        FeatureExtractionFunctionArn: !GetAtt FeatureExtractionFunction.Arn
        GraphAnomalyScoringFunctionArn: !GetAtt GraphAnomalyScoringFunction.Arn
        BedrockExplanationFunctionArn: !GetAtt BedrockExplanationFunction.Arn
        ComplianceAlertTopicArn: !Ref ComplianceAlertTopic
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref FeatureExtractionFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref GraphAnomalyScoringFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref BedrockExplanationFunction
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ComplianceAlertTopic.TopicName

  # -------------------------------------------------------------------------
  # 8. SNS Compliance Alert Topic
  # -------------------------------------------------------------------------
  ComplianceAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: AML-Compliance-Alerts

  # -------------------------------------------------------------------------
  # 9. CloudWatch Alarms (SRE Hardening)
  # -------------------------------------------------------------------------
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "High 5XX error rate on Fraud Detection API"
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref TransactionApi

  WorkflowFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Step Function Execution Failures"
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref FraudDetectionWorkflow

Outputs:
  TransactionApiUrl:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${TransactionApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/transactions"
  AlertsApiUrl:
    Description: "Endpoint URL to fetch recent flagged transactions"
    Value: !Sub "https://${TransactionApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/alerts"
  ComplianceTopicArn:
    Description: "ARN for the SNS Compliance Alerts Topic"
    Value: !Ref ComplianceAlertTopic